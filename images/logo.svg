<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="#1a1a1a" stroke="#f28c00" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#f28c00" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Background gradient -->
  <radialGradient id="bg" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#2a1800"/>
    <stop offset="100%" stop-color="#0d0d0d"/>
  </radialGradient>
  <circle cx="100" cy="100" r="84" fill="url(#bg)"/>

  <!-- Warrior silhouette (simplified gladiator) -->
  <!-- Body -->
  <g fill="#f28c00" opacity="0.95">
    <!-- Head -->
    <ellipse cx="100" cy="68" rx="10" ry="11"/>
    <!-- Helmet crest -->
    <polygon points="92,60 100,45 108,60" fill="#f28c00"/>
    <!-- Torso -->
    <rect x="90" y="80" width="20" height="28" rx="3"/>
    <!-- Left arm raised with sword -->
    <rect x="72" y="75" width="18" height="7" rx="3" transform="rotate(-30 81 78)"/>
    <!-- Sword blade -->
    <rect x="58" y="62" width="4" height="22" rx="2" transform="rotate(-30 60 73)" fill="#ffd700"/>
    <!-- Right arm -->
    <rect x="110" y="78" width="16" height="7" rx="3" transform="rotate(15 118 81)"/>
    <!-- Shield (right hand) -->
    <ellipse cx="128" cy="88" rx="8" ry="11" fill="#c47000"/>
    <!-- Legs -->
    <rect x="90" y="108" width="8" height="22" rx="3"/>
    <rect x="102" y="108" width="8" height="22" rx="3"/>
  </g>

  <!-- Text arc: IRON WARRIORS GYM top -->
  <path id="topArc" d="M 20,100 A 80,80 0 0,1 180,100" fill="none"/>
  <text font-family="'Arial Black', Arial, sans-serif" font-size="13" font-weight="900" fill="#f28c00" letter-spacing="3">
    <textPath href="#topArc" startOffset="12%">IRON WARRIOR'S GYM</textPath>
  </text>

  <!-- Bottom arc text -->
  <path id="botArc" d="M 25,105 A 75,75 0 0,0 175,105" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#aaa" letter-spacing="2">
    <textPath href="#botArc" startOffset="8%">STRENGTH · DISCIPLINE · HONOR</textPath>
  </text>

  <!-- Bottom divider dots -->
  <circle cx="85" cy="158" r="2.5" fill="#f28c00"/>
  <circle cx="100" cy="158" r="2.5" fill="#f28c00"/>
  <circle cx="115" cy="158" r="2.5" fill="#f28c00"/>
</svg>
