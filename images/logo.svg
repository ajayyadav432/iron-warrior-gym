  <rect x="48" y="62" width="104" height="6" rx="3" fill="#f28c00"/>
  <rect x="40" y="52" width="10" height="26" rx="2" fill="#f28c00"/>
  <rect x="150" y="52" width="10" height="26" rx="2" fill="#f28c00"/>
  <!-- IW monogram -->
  <text x="100" y="138" text-anchor="middle" font-family="Impact, 'Bebas Neue', 'Arial Black', sans-serif" font-size="66" font-weight="900" fill="#fff" letter-spacing="2">IW</text>
  <rect x="62" y="148" width="76" height="4" fill="#f28c00"/>
